<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🎵 MusicAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--accent:#c8ff00;--accent2:#7c3aed;--text:#f0f0f0;--muted:#555;--border:rgba(200,255,0,0.15);--card:rgba(255,255,255,0.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:rgba(10,10,15,.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:4px;color:var(--accent)}
.hdr-right{display:flex;gap:.5rem;align-items:center}
.hdr-pill{display:flex;align-items:center;gap:.35rem;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:.35rem .75rem;font-size:.72rem;color:var(--accent);cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap}
.hdr-pill:hover{background:rgba(200,255,0,.1)}
.hdr-pill.key-ok{border-color:rgba(200,255,0,.5)}
.hdr-pill.key-none{border-color:rgba(255,100,100,.3);color:#f87171}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:1.5rem;width:100%;max-width:500px}
.sheet-title{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:1rem}
.mopt{display:flex;align-items:center;gap:.9rem;padding:.9rem;border-radius:14px;border:1px solid rgba(255,255,255,.06);background:var(--card);margin-bottom:.6rem;cursor:pointer;transition:all .2s}
.mopt:hover{border-color:var(--accent);background:rgba(200,255,0,.05)}
.mopt.sel{border-color:var(--accent);background:rgba(200,255,0,.1)}
.mopt-icon{font-size:1.3rem;width:34px;text-align:center;flex-shrink:0}
.mopt-info{flex:1}
.mopt-name{font-weight:600;font-size:.88rem;margin-bottom:.15rem}
.mopt-desc{font-size:.72rem;color:var(--muted)}
.mopt-right{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem;flex-shrink:0}
.mbadge{font-size:.62rem;padding:.2rem .5rem;border-radius:6px;background:rgba(200,255,0,.15);color:var(--accent)}
.mrpm{font-size:.62rem;color:var(--muted);white-space:nowrap}
.key-popup-title{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:1rem}
.key-hint{font-size:.75rem;color:var(--muted);margin-bottom:.8rem}
.key-hint a{color:var(--accent);text-decoration:none}
.key-input-wrap{display:flex;gap:.5rem;margin-bottom:.8rem}
.key-input-wrap input{flex:1;background:var(--bg3);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.85rem 1rem;color:var(--text);font-size:.9rem;font-family:'DM Mono',monospace;outline:none;transition:border .2s}
.key-input-wrap input:focus{border-color:var(--accent)}
.key-input-wrap input::placeholder{color:var(--muted)}
.key-save-btn{background:var(--accent);color:#000;border:none;border-radius:12px;padding:.85rem 1.2rem;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif}
.sheet-cancel{width:100%;padding:.85rem;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:transparent;color:var(--muted);font-size:.88rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;margin-top:.3rem}
.sheet-cancel:hover{border-color:#f44;color:#f44}

/* TABS */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:.85rem;text-align:center;font-size:.78rem;color:var(--muted);cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;font-family:'Noto Sans KR',sans-serif}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TAB CONTENT */
.tc{display:none;flex:1;flex-direction:column;overflow:hidden}
.tc.active{display:flex}

/* SEARCH */
.search-wrap{padding:1rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.sbar{display:flex;gap:.6rem;margin-bottom:.7rem}
.sbar input{flex:1;background:var(--bg3);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.75rem 1rem;color:var(--text);font-size:1rem;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border .2s}
.sbar input:focus{border-color:var(--accent)}
.sbar input::placeholder{color:var(--muted)}
.sbar button{background:var(--accent);color:#000;border:none;border-radius:12px;padding:.75rem 1.1rem;font-size:1rem;cursor:pointer;font-weight:700;transition:all .2s}
.sbar button:hover{background:#d4ff33}
.tbts{display:flex;gap:.5rem}
.tbt{flex:1;padding:.45rem;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif}
.tbt.active{background:rgba(200,255,0,.15);border-color:var(--accent);color:var(--accent)}
.results-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.results{flex:1;overflow-y:auto;padding:.8rem}
.pagination{display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.pg-btn{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:.4rem .7rem;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;min-width:32px;text-align:center}
.pg-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:rgba(200,255,0,.15);border-color:var(--accent);color:var(--accent);font-weight:700}
.pg-btn:disabled{opacity:.3;cursor:not-allowed}
.breadcrumb{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.bc-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.8rem;font-family:'Noto Sans KR',sans-serif;padding:0}
.bc-sep{color:var(--muted);font-size:.75rem}
.bc-cur{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:.9rem;margin-bottom:.7rem;cursor:pointer;transition:all .2s;display:flex;gap:.9rem;align-items:center}
.ri:hover{border-color:var(--accent);background:rgba(200,255,0,.05)}
.ri-img{width:52px;height:52px;border-radius:8px;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden}
.ri-img img{width:100%;height:100%;object-fit:cover}
.ri-info{flex:1;min-width:0}
.ri-title{font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.25rem}
.ri-sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-badge{font-size:.65rem;padding:.2rem .5rem;border-radius:6px;background:rgba(124,58,237,.3);color:#a78bfa;flex-shrink:0}

/* ANALYSIS */
.ana-hdr{padding:1rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.ana-now{display:flex;align-items:center;gap:.8rem}
.ana-cover{width:52px;height:52px;border-radius:10px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.ana-cover img{width:100%;height:100%;object-fit:cover}
.ana-meta{flex:1;min-width:0}
.ana-title{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ana-artist{font-size:.8rem;color:var(--muted)}
.ana-empty{color:var(--muted);font-size:.85rem}
.ana-btns{display:flex;gap:.5rem;padding:.7rem 1rem;flex-shrink:0;overflow-x:auto}
.ana-btns::-webkit-scrollbar{display:none}
.ana-btn{flex:1;min-width:0;padding:.6rem .3rem;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:var(--card);color:var(--text);font-size:.75rem;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.2rem;white-space:nowrap}
.ana-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(200,255,0,.05)}
.ana-btn.active{border-color:var(--accent);background:rgba(200,255,0,.08)}
.ana-btn:disabled{opacity:.3;cursor:not-allowed}
.ana-btn-icon{font-size:1rem}
.ana-btn-label{font-weight:600;font-size:.75rem}
.ana-btn-desc{font-size:.62rem;color:var(--muted)}
.ana-content{flex:1;overflow-y:auto;padding:1rem}

/* RESULT */
.result-box{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:1rem}
.result-box-title{font-size:.65rem;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:.8rem}
.result-text{font-size:.9rem;line-height:1.8;color:#ddd;white-space:pre-wrap}
.md-h{display:inline-block;color:var(--accent);font-size:.95rem;margin-top:.4rem}
.md-hr{display:block;height:1px;background:var(--border);margin:.7rem 0}
.lyric-plain{font-size:.9rem;color:#ddd;line-height:2.1;white-space:pre-line}
.lyric-line{margin-bottom:.8rem;padding-bottom:.8rem;border-bottom:1px solid rgba(255,255,255,.05)}
.lyric-line:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.lyric-orig{font-size:.9rem;color:#ddd;line-height:1.6}
.lyric-ko{font-size:.85rem;color:#a78bfa;line-height:1.6;margin-top:.2rem}
.lyric-explain{font-size:.82rem;color:#86efac;line-height:1.6;margin-top:.3rem;padding:.4rem .6rem;background:rgba(134,239,172,.06);border-radius:6px;border-left:2px solid rgba(134,239,172,.3)}

/* CHAT */
.chat-hdr{padding:1rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.chat-now{display:flex;align-items:center;gap:.8rem}
.chat-cover{width:36px;height:36px;border-radius:8px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1rem}
.chat-cover img{width:100%;height:100%;object-fit:cover}
.chat-meta{flex:1;min-width:0}
.chat-track{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{font-size:.75rem;color:var(--muted)}
.chat-area{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.bbl{max-width:82%;padding:.7rem .9rem;border-radius:14px;font-size:.86rem;line-height:1.6;white-space:pre-wrap}
.bbl.u{background:var(--accent);color:#000;align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
.bbl.a{background:var(--bg3);color:#ddd;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid rgba(255,255,255,.06)}
.tool-row{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.3rem}
.chip{background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:.4rem .75rem;color:var(--text);font-size:.76rem;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.diff-go{align-self:flex-start;background:var(--accent);color:#000;border:none;border-radius:12px;padding:.7rem 1.1rem;font-size:.88rem;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:.2rem}
.chat-bar{display:flex;gap:.6rem;padding:.8rem;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.chat-bar input{flex:1;background:var(--bg3);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.7rem .9rem;color:var(--text);font-size:.9rem;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border .2s}
.chat-bar input:focus{border-color:var(--accent)}
.chat-send{background:var(--accent2);border:none;border-radius:12px;padding:.7rem 1rem;color:#fff;font-size:1.1rem;cursor:pointer;transition:all .2s}
.chat-send:hover{background:#6d28d9}

/* UTILS */
.loading{display:flex;align-items:center;justify-content:center;padding:2rem;color:var(--muted);font-size:.88rem;gap:.7rem}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted);font-size:.88rem}
.empty .ico{font-size:2.5rem;margin-bottom:.8rem}
.retry-msg{color:var(--accent);font-size:.85rem;text-align:center;padding:1rem}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-logo">MUSICAI</div>
    <div class="hdr-right">
      <div class="hdr-pill" id="model-pill" onclick="openModelSheet()">
        <div class="pill-dot"></div>
        <span id="pill-lbl">⚡ Lite 3.1</span>
        <span style="color:var(--muted);font-size:.6rem">▾</span>
      </div>
      <div class="hdr-pill key-ok" id="key-pill">
        <span>☁️</span>
        <span>Worker</span>
      </div>
    </div>
  </div>

  <!-- MODEL SHEET -->
  <div class="overlay" id="model-overlay" onclick="if(event.target===this)closeOverlay('model-overlay')">
    <div class="sheet">
      <div class="sheet-title">🤖 Gemini 모델 선택</div>
      <div id="model-list" style="max-height:58vh;overflow-y:auto;margin-bottom:.6rem"></div>
      <div id="model-note" style="font-size:.68rem;color:var(--muted);margin-bottom:.6rem;line-height:1.5"></div>
      <button class="sheet-cancel" onclick="closeOverlay('model-overlay')">취소</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" id="tab-s" onclick="goTab('s')">🔍 검색</div>
    <div class="tab" id="tab-a" onclick="goTab('a')">🎵 분석</div>
    <div class="tab" id="tab-c" onclick="goTab('c')">💬 대화</div>
  </div>

  <!-- SEARCH TAB -->
  <div class="tc active" id="tc-s">
    <div id="search-source" style="display:none;font-size:.7rem;color:var(--muted);padding:.3rem 1rem;background:var(--bg2);letter-spacing:.5px"></div>
  <div class="search-wrap">
      <div class="sbar">
        <input type="text" id="sq" placeholder="곡, 앨범, 아티스트..." onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">검색</button>
      </div>
      <div class="tbts">
        <button class="tbt active" id="t-song" onclick="setType('song')">🎵 곡</button>
        <button class="tbt" id="t-album" onclick="setType('album')">💿 앨범</button>
        <button class="tbt" id="t-musicArtist" onclick="setType('musicArtist')">🎤 아티스트</button>
      </div>
    </div>
    <!-- breadcrumb -->
    <div class="breadcrumb" id="breadcrumb" style="display:none">
      <button class="bc-btn" id="bc-back" onclick="bcBack()">← 뒤로</button>
      <span class="bc-sep">›</span>
      <span class="bc-cur" id="bc-cur"></span>
    </div>
    <div class="results-wrap">
      <div class="results" id="results">
        <div class="empty"><div class="ico">🎵</div>곡, 앨범, 아티스트를 검색해보세요</div>
      </div>
      <div class="pagination" id="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- ANALYSIS TAB -->
  <div class="tc" id="tc-a" style="flex-direction:column">
    <div class="ana-hdr">
      <div class="ana-now" id="ana-now">
        <div class="ana-empty">검색 탭에서 곡을 선택해주세요</div>
      </div>
    </div>
    <div class="ana-btns">
      <button class="ana-btn" id="btn-desc" onclick="doSection('desc')">
        <div class="ana-btn-icon">📖</div>
        <div class="ana-btn-label">곡 설명</div>
        <div class="ana-btn-desc">AI 세세 분석</div>
      </button>
      <button class="ana-btn" id="btn-lyrics" onclick="doSection('lyrics')">
        <div class="ana-btn-icon">🎤</div>
        <div class="ana-btn-label">가사</div>
        <div class="ana-btn-desc">원문 가사</div>
      </button>
      <button class="ana-btn" id="btn-trans" onclick="doSection('trans')" disabled>
        <div class="ana-btn-icon">🌐</div>
        <div class="ana-btn-label">가사 번역</div>
        <div class="ana-btn-desc">가사 먼저 필요</div>
      </button>
      <button class="ana-btn" id="btn-interp" onclick="doSection('interp')" disabled>
        <div class="ana-btn-icon">🔍</div>
        <div class="ana-btn-label">가사 해석</div>
        <div class="ana-btn-desc">번역 먼저 필요</div>
      </button>
    </div>
    <div class="ana-content" id="ana-content">
      <div class="empty"><div class="ico">👆</div>위 버튼을 눌러 분석을 시작하세요</div>
    </div>
  </div>

  <!-- CHAT TAB -->
  <div class="tc" id="tc-c" style="flex-direction:column">
    <div class="chat-hdr">
      <div class="chat-now" id="chat-now">
        <div class="chat-meta">
          <div class="chat-track" id="chat-track-name">선택된 곡 없음</div>
          <div class="chat-sub">곡을 고르면 파트별로 연주·노래 난이도를 따져줍니다</div>
        </div>
      </div>
    </div>
    <div class="chat-area" id="chat-area">
      <div class="bbl a">검색 탭에서 곡을 먼저 선택해주세요 🎵</div>
    </div>
    <div class="chat-bar">
      <input type="text" id="chat-input" placeholder="난이도에 대해 더 물어보기..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="chat-send" onclick="sendChat()">↑</button>
    </div>
  </div>

</div>
<script>
// ── 다중 소스 검색 ──
// Worker(iTunes→Deezer→MusicBrainz)와 브라우저 직접 iTunes를 동시에 던진다.
// Apple이 Cloudflare IP를 막아서 Worker는 대개 Deezer로 떨어지지만, PC에서는 직접 호출이
// 통한다. iTunes 쪽이 인기순 정렬과 오타 보정이 가장 좋으므로 그 결과를 우선한다.
async function itunesSearch(q, stype){
  const dbg=[];
  const workerP=searchViaWorker(q, stype, dbg);
  const directP=searchItunesDirect(q, stype, dbg);

  // iTunes만 인기순 정렬이 제대로 되므로(Deezer는 엣지에서 자주 빈손, MusicBrainz는
  // 원곡이 상위에 못 든다) 넉넉히 기다린다. 막혀 있으면 대개 즉시 실패하므로 손해가 적다.
  const direct=await Promise.race([directP, sleep(4000)]);
  if(direct) return direct;

  const worker=await workerP;
  // 왜 iTunes를 못 썼는지 출처 옆에 남긴다(기기별 진단용).
  if(worker) return {...worker, note:dbg.find(d=>d.startsWith('직접:'))||'직접: 응답 없음(4초 초과)'};

  // Worker도 실패했으면 느린 직접 호출이라도 끝까지 기다려 본다.
  const lateDirect=await directP;
  if(lateDirect) return lateDirect;

  const mb=await searchMusicBrainzDirect(q, stype, dbg);
  if(mb) return mb;

  throw new Error('모든 검색 소스 실패 → '+dbg.join(' | '));
}

// 아래 세 함수는 실패해도 예외를 던지지 않고 null을 돌려준다(병렬 실행 중 미처리 거부 방지).
async function searchViaWorker(q, stype, dbg){
  try{
    const url=`${WORKER_URL}/itunes?q=${encodeURIComponent(q)}&entity=${stype}&country=KR&limit=50`;
    const res=await fetch(url, {signal:AbortSignal.timeout(6000)});
    if(!res.ok){
      const body=await res.text().catch(()=>'');
      dbg.push(`Worker: HTTP ${res.status} ${body.slice(0,300)}`);
      return null;
    }
    const data=await res.json();
    if(data.results?.length) return {results:data.results, source:data.source||'iTunes'};
    dbg.push(`Worker: ok but empty (${JSON.stringify(data).slice(0,120)})`);
  }catch(e){dbg.push(`Worker: ${e.name}: ${e.message}`);}
  return null;
}

async function searchItunesDirect(q, stype, dbg){
  try{
    const url=`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=${stype}&limit=50&country=KR`;
    const res=await fetch(url, {signal:AbortSignal.timeout(5000)});
    if(!res.ok){dbg.push(`직접: HTTP ${res.status}`);return null;}
    const data=await res.json();
    if(data.results?.length) return {results:data.results, source:'iTunes (직접)'};
    dbg.push('직접: ok but empty');
  }catch(e){dbg.push(`직접: ${e.name}: ${e.message}`);}
  return null;
}

// 최후 수단. Worker까지 닿지 않을 때만 쓰인다.
async function searchMusicBrainzDirect(q, stype, dbg){
  if(stype==='album') return null;
  try{
    const mbType=stype==='song'?'recording':'artist';
    const url=`https://musicbrainz.org/ws/2/${mbType}/?query=${encodeURIComponent(q)}&limit=20&fmt=json`;
    const res=await fetch(url, {signal:AbortSignal.timeout(5000)});
    if(!res.ok){dbg.push(`MusicBrainz: HTTP ${res.status}`);return null;}
    const data=await res.json();
    const items=stype==='song'?(data.recordings||[]):(data.artists||[]);
    if(!items.length){dbg.push('MusicBrainz: ok but empty');return null;}
    items.sort((a,b)=>(b.score||0)-(a.score||0));   // MusicBrainz 자체 관련도 순
    // 가수·앨범을 이어서 탐색하려면 MBID가 있어야 한다.
    const converted=items.map(item=>stype==='song'?{
      trackId:item.id,
      trackName:item.title||'',
      artistName:item['artist-credit']?.[0]?.artist?.name||item['artist-credit']?.[0]?.name||'',
      artistId:item['artist-credit']?.[0]?.artist?.id||'',
      collectionName:item.releases?.[0]?.title||'',
      collectionId:item.releases?.[0]?.['release-group']?.id||'',
      releaseDate:item.releases?.[0]?.date||'',
      artworkUrl60:'',
      wrapperType:'track',
    }:{
      artistId:item.id,
      artistName:item.name||'',
      primaryGenreName:item.disambiguation||item.area?.name||'',
      wrapperType:'artist',
    });
    return {results:converted, source:'MusicBrainz'};
  }catch(e){dbg.push(`MusicBrainz: ${e.name}: ${e.message}`);}
  return null;
}

// ── MODEL ──
// 모델 목록은 Google에서 받아온다. 새 모델이 나와도 앱을 고칠 필요가 없다.
// 하루 한 번만 새로 받고 그 사이에는 저장해 둔 걸 쓴다.
async function loadModels(){
  try{
    const saved=JSON.parse(localStorage.getItem('ma_models')||'null');
    if(saved && Date.now()-saved.at < 86400000 && saved.list?.length){
      S.models=saved.list; S.quotaCheckedOn=saved.checkedOn||''; return;
    }
  }catch{}
  try{
    const res=await fetch(`${WORKER_URL}/models`,{signal:AbortSignal.timeout(8000)});
    const d=await res.json();
    if(d.models?.length){
      S.models=d.models; S.quotaCheckedOn=d.quotaCheckedOn||'';
      localStorage.setItem('ma_models',JSON.stringify({at:Date.now(),list:d.models,checkedOn:d.quotaCheckedOn}));
    }
  }catch{ /* 못 받아오면 지금 고른 모델로 계속 쓴다 */ }
}

// 오늘 이 기기에서 모델별로 몇 번 불렀는지. Google이 일일 한도를 API로 주지 않아
// 실제 사용량이라도 보여준다. 날짜가 바뀌면 0부터 다시 센다.
function usageMap(){
  try{
    const u=JSON.parse(localStorage.getItem('ma_usage')||'{}');
    return u.day===new Date().toDateString() ? u : {day:new Date().toDateString(), n:{}};
  }catch{ return {day:new Date().toDateString(), n:{}}; }
}
function bumpUsage(model){
  const u=usageMap();
  u.n[model]=(u.n[model]||0)+1;
  try{ localStorage.setItem('ma_usage',JSON.stringify(u)); }catch{}
}

// 모델 id에서 짧은 표시 이름을 만든다("gemini-3.5-flash-lite" → "3.5 Flash Lite").
function shortLabel(id){
  return id.replace(/^gemini-/,'').replace(/-preview.*$/,'')
           .replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}

async function openModelSheet(){
  const box=document.getElementById('model-list');
  const overlay=document.getElementById('model-overlay');
  overlay.classList.add('open');
  if(!S.models.length){
    box.innerHTML='<div class="loading"><div class="spin"></div>모델 목록 불러오는 중...</div>';
    await loadModels();
  }
  if(!S.models.length){
    box.innerHTML='<div class="empty" style="padding:1rem">목록을 불러오지 못했습니다. 지금 모델로 계속 사용합니다.</div>';
    return;
  }
  const used=usageMap().n;
  box.innerHTML=S.models.map(m=>{
    const sel=m.id===S.model?' sel':'';
    const q=m.quota;
    const n=used[m.id]||0;
    // 무료로 쓸 때 실제로 걸리는 건 하루 요청 수라 그걸 앞세운다.
    const daily=q ? (q.rpd ? `하루 ${q.rpd}회 · 분당 ${q.rpm}회` : '무료 한도 없음') : '한도 정보 없음';
    const badge=q&&q.rpd>=500 ? '<div class="mbadge">넉넉</div>' : '';
    const ctx=m.inputLimit?`컨텍스트 ${Math.round(m.inputLimit/1024)}K`:'';
    return `<div class="mopt${sel}" onclick="selModel('${esc(m.id)}')">
      <div class="mopt-icon">${m.id.includes('lite')?'⚡':m.id.includes('pro')?'🧠':'🔥'}</div>
      <div class="mopt-info"><div class="mopt-name">${esc(m.label||m.id)}</div>
        <div class="mopt-desc">${esc(daily)}${m.thinking?' · 추론':''} · ${esc(ctx)}</div></div>
      <div class="mopt-right">${badge}<div class="mrpm">오늘 ${n}${q&&q.rpd?' / '+q.rpd:''}회</div></div>
    </div>`;
  }).join('');
  const note=document.getElementById('model-note');
  if(note) note.innerHTML=
    `모델 목록은 Google에서 직접 받아옵니다. 한도는 API로 제공되지 않아 `+
    `<b>${esc(S.quotaCheckedOn||'-')}</b> 기준으로 적어 둔 값이라 지금과 다를 수 있습니다. `+
    `<a href="https://aistudio.google.com/usage" target="_blank" rel="noopener" style="color:var(--accent)">AI Studio에서 실제 사용량 보기 ↗</a>`;
}
function closeOverlay(id){document.getElementById(id).classList.remove('open');}
function selModel(model){
  const pill=shortLabel(model);
  S.model=model;S.pill=pill;
  localStorage.setItem('ma_model',model);localStorage.setItem('ma_pill',pill);
  document.getElementById('pill-lbl').textContent=pill;
  closeOverlay('model-overlay');
}


// ── TABS ──
function goTab(n){
  ['s','a','c'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===n);
    document.getElementById('tc-'+t).classList.toggle('active',t===n);
  });
}
function setType(t){
  S.stype=t;
  document.querySelectorAll('.tbt').forEach(b=>b.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');
  // 브레드크럼 리셋
  S.browseStack=[];
  hideBreadcrumb();
}

// ── BREADCRUMB ──
function showBreadcrumb(label){
  document.getElementById('breadcrumb').style.display='flex';
  document.getElementById('bc-cur').textContent=label;
}
function hideBreadcrumb(){
  document.getElementById('breadcrumb').style.display='none';
}
function bcBack(){
  S.browseStack.pop();
  if(S.browseStack.length===0){
    hideBreadcrumb();
    renderResults(S.searchResults,0);
  }else{
    const prev=S.browseStack[S.browseStack.length-1];
    showBreadcrumb(prev.label);
    renderList(prev.items, prev.isTrackList, prev.artistName);
  }
}

// ── SEARCH ──
async function doSearch(){
  const q=document.getElementById('sq').value.trim();if(!q)return;
  S.browseStack=[];hideBreadcrumb();
  const area=document.getElementById('results');
  area.innerHTML='<div class="loading"><div class="spin"></div>검색 중...</div>';
  document.getElementById('pagination').style.display='none';
  document.getElementById('search-source').style.display='none';
  try{
    let results, source, note;
    try{
      ({results, source, note}=await itunesSearch(q, S.stype));
    }catch(e1){
      area.innerHTML='<div class="loading"><div class="spin"></div>재시도 중...</div>';
      ({results, source, note}=await itunesSearch(q, S.stype));
    }
    const src=source.includes('Deezer')?'Deezer':source.includes('MusicBrainz')?'MusicBrainz':'iTunes';
    results.forEach(r=>r._src=src);
    S.searchResults=results;
    S.searchSource=source;
    if(!results.length){area.innerHTML='<div class="empty"><div class="ico">😢</div>검색 결과가 없습니다</div>';return;}
    // 출처 표시
    const srcEl=document.getElementById('search-source');
    srcEl.textContent='검색 출처: '+source+(note?'  ('+note+')':'');
    srcEl.style.display='block';
    renderResults(results,0);
  }catch(e){area.innerHTML=`<div class="empty"><div class="ico">⚠️</div>검색 실패: ${esc(e.message)}</div>`;}
}

function renderResults(items,page){
  S.currentPage=page;
  const start=page*S.pageSize;
  const slice=items.slice(start,start+S.pageSize);
  const area=document.getElementById('results');
  area.innerHTML='';
  slice.forEach(item=>area.appendChild(makeResultItem(item)));
  // 페이지네이션
  const totalPages=Math.ceil(items.length/S.pageSize);
  const pg=document.getElementById('pagination');
  if(totalPages<=1){pg.style.display='none';return;}
  pg.style.display='flex';
  pg.innerHTML='';
  // 이전
  const prevBtn=document.createElement('button');
  prevBtn.className='pg-btn';prevBtn.textContent='←';
  prevBtn.disabled=page===0;
  prevBtn.onclick=()=>renderResults(items,page-1);
  pg.appendChild(prevBtn);
  // 페이지 번호
  const maxShow=5;
  let startP=Math.max(0,page-2);
  let endP=Math.min(totalPages-1,startP+maxShow-1);
  if(endP-startP<maxShow-1)startP=Math.max(0,endP-maxShow+1);
  for(let i=startP;i<=endP;i++){
    const btn=document.createElement('button');
    btn.className='pg-btn'+(i===page?' active':'');
    btn.textContent=i+1;
    const pi=i;btn.onclick=()=>renderResults(items,pi);
    pg.appendChild(btn);
  }
  // 다음
  const nextBtn=document.createElement('button');
  nextBtn.className='pg-btn';nextBtn.textContent='→';
  nextBtn.disabled=page>=totalPages-1;
  nextBtn.onclick=()=>renderResults(items,page+1);
  pg.appendChild(nextBtn);
}

// 커버가 없는 음반이 많아(특히 MusicBrainz의 커버 아트 아카이브) 404면 아이콘으로 되돌린다.
function imgCell(url, icon){
  return url
    ? `<div class="ri-img"><img src="${esc(url)}" loading="lazy" onerror="this.parentNode.textContent='${icon}'"></div>`
    : `<div class="ri-img">${icon}</div>`;
}

function makeResultItem(item){
  const div=document.createElement('div');div.className='ri';
  div.onclick=()=>selectItem(item);
  let title='',sub='',badge='',icon='🎵';
  const img=item.artworkUrl60||'';
  if(S.stype==='song'){
    title=item.trackName||'';
    sub=(item.artistName||'')+' · '+(item.collectionName||'');
    badge=item.releaseDate?.substring(0,4)||'';
  }else if(S.stype==='album'){
    title=item.collectionName||'';
    sub=item.artistName||'';
    badge=item.trackCount?item.trackCount+'곡':(item.releaseDate?.substring(0,4)||'');
    icon='💿';
  }else{
    title=item.artistName||'';
    sub=item.primaryGenreName||'';
    icon='🎤';
  }
  div.innerHTML=`${imgCell(img,icon)}<div class="ri-info"><div class="ri-title">${esc(title)}</div><div class="ri-sub">${esc(sub)}</div></div>${badge?`<div class="ri-badge">${esc(String(badge))}</div>`:''}`;
  return div;
}

async function selectItem(item){
  const area=document.getElementById('results');

  if(S.stype==='musicArtist'){
    area.innerHTML='<div class="loading"><div class="spin"></div>앨범 불러오는 중...</div>';
    document.getElementById('pagination').style.display='none';
    const label=item.artistName||'';
    showBreadcrumb(label);
    try{
      let albums;
      if(item._src==='Deezer'){
        const res=await fetch(`${WORKER_URL}/deezer-artist-albums?id=${item.artistId}`,{signal:AbortSignal.timeout(8000)});
        const d=await res.json();
        if(!res.ok||d.error) throw new Error(d.error||'fail');
        albums=d.results||[];
      }else if(item._src==='MusicBrainz'){
        const res=await fetch(`${WORKER_URL}/mb-artist-albums?id=${item.artistId}`,{signal:AbortSignal.timeout(8000)});
        const d=await res.json();
        if(!res.ok||d.error) throw new Error(d.error||'fail');
        albums=d.results||[];
      }else{
        let res;
        try{
          res=await fetch(`${WORKER_URL}/itunes-lookup?id=${item.artistId}&entity=album&country=US&limit=20`,{signal:AbortSignal.timeout(6000)});
          if(!res.ok) throw new Error('fail');
        }catch{
          res=await fetch(`https://itunes.apple.com/lookup?id=${item.artistId}&entity=album&limit=20&country=US`);
        }
        const d=await res.json();
        albums=(d.results||[]).filter(r=>r.wrapperType==='collection');
      }
      albums.forEach(a=>a._src=item._src||'iTunes');
      S.browseStack.push({label,items:albums,isTrackList:false,artistName:label});
      renderList(albums,false,label);
    }catch(e){area.innerHTML=`<div class="empty"><div class="ico">⚠️</div>앨범을 불러올 수 없습니다: ${esc(e.message)}</div>`;}
    return;
  }

  if(S.stype==='album'){
    await loadAlbumTracks(item);
    return;
  }

  // 곡 선택
  const art=(item.artworkUrl100||item.artworkUrl60||'').replace('100x100bb','600x600bb');
  loadTrack(item.trackName||'', item.artistName||'', art, {
    album:item.collectionName||'', year:(item.releaseDate||'').substring(0,4),
    durationMs:item.trackTimeMillis||0, genre:item.primaryGenreName||''
  });
}

async function loadAlbumTracks(album){
  const area=document.getElementById('results');
  area.innerHTML='<div class="loading"><div class="spin"></div>트랙 목록 불러오는 중...</div>';
  document.getElementById('pagination').style.display='none';
  const label=album.collectionName||album.title||'앨범';
  showBreadcrumb(label);
  try{
    const id=album.collectionId;
    let tracks;
    if(album._src==='Deezer'){
      const res=await fetch(`${WORKER_URL}/deezer-album-tracks?id=${id}`,{signal:AbortSignal.timeout(8000)});
      const d=await res.json();
      if(!res.ok||d.error) throw new Error(d.error||'fail');
      tracks=d.results||[];
    }else if(album._src==='MusicBrainz'){
      const res=await fetch(`${WORKER_URL}/mb-album-tracks?id=${id}`,{signal:AbortSignal.timeout(8000)});
      const d=await res.json();
      if(!res.ok||d.error) throw new Error(d.error||'fail');
      tracks=d.results||[];
    }else{
      let res;
      try{
        res=await fetch(`${WORKER_URL}/itunes-lookup?id=${id}&entity=song&country=US&limit=200`,{signal:AbortSignal.timeout(6000)});
        if(!res.ok) throw new Error('fail');
      }catch{
        res=await fetch(`https://itunes.apple.com/lookup?id=${id}&entity=song&country=US&limit=200`);
      }
      const d=await res.json();
      const allResults=d.results||[];
      tracks=allResults.filter(r=>r.wrapperType==='track');
      if(!tracks.length) tracks=allResults.filter(r=>r.kind==='song');
      if(!tracks.length) tracks=allResults.slice(1).filter(r=>r.trackName);
    }
    tracks=tracks.sort((a,b)=>(a.trackNumber||0)-(b.trackNumber||0));
    const art=(album.artworkUrl100||album.artworkUrl60||'').replace('100x100bb','600x600bb');
    S.browseStack.push({label,items:tracks,isTrackList:true,artistName:album.artistName||'',artUrl:art});
    renderList(tracks,true,album.artistName||'',art);
  }catch(e){
    area.innerHTML=`<div class="empty"><div class="ico">⚠️</div>트랙 목록 실패: ${esc(e.message)}</div>`;
  }
}

function renderList(items,isTrackList,artistName,artUrl){
  const area=document.getElementById('results');
  area.innerHTML='';
  if(!items.length){area.innerHTML='<div class="empty"><div class="ico">😢</div>항목이 없습니다</div>';return;}
  items.forEach((item,idx)=>{
    const div=document.createElement('div');div.className='ri';
    if(isTrackList){
      const title=item.trackName||item.title||'';
      const dur=item.trackTimeMillis?fmtMs(item.trackTimeMillis):(item.duration||'');
      const num=item.trackNumber||idx+1;
      const trackArt=artUrl||(item.artworkUrl100||'').replace('100x100bb','600x600bb');
      div.onclick=()=>loadTrack(title,artistName||item.artistName||'',trackArt,
        {album:S.browseStack[S.browseStack.length-1]?.label||'', durationMs:item.trackTimeMillis||0});
      div.innerHTML=`<div class="ri-img" style="font-size:.85rem;color:var(--muted);font-family:'DM Mono',monospace;font-weight:600">${num}</div><div class="ri-info"><div class="ri-title">${esc(title)}</div><div class="ri-sub">${esc(dur)}</div></div>`;
    }else{
      const title=item.collectionName||item.title||'';
      const year=item.releaseDate?.substring(0,4)||item.year||'';
      div.onclick=()=>loadAlbumTracks(item);
      div.innerHTML=`${imgCell(item.artworkUrl60||'','💿')}<div class="ri-info"><div class="ri-title">${esc(title)}</div><div class="ri-sub">${esc(year)}</div></div>`;
    }
    area.appendChild(div);
  });
}

// ── LOAD TRACK ──
// meta에는 검색 결과에 딸려 온 앨범·발매연도·길이·장르를 담는다. 곡 설명을 만들 때
// 모델에게 넘길 실제 근거라, 예전처럼 버리면 제목과 가수만 보고 쓰게 된다.
function loadTrack(title,artist,artUrl,meta={}){
  S.track={title,artist,artUrl,lyrics:null,lyricsSrc:null,
           album:meta.album||'',year:meta.year||'',durationMs:meta.durationMs||0,genre:meta.genre||''};
  S.cache={};
  // 분석탭 업데이트
  document.getElementById('ana-now').innerHTML=`
    <div class="ana-cover">${artUrl?`<img src="${artUrl}">`:'🎵'}</div>
    <div class="ana-meta"><div class="ana-title">${esc(title)}</div><div class="ana-artist">${esc(artist)}</div></div>`;
  document.querySelectorAll('.ana-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-trans').disabled=true;
  document.getElementById('btn-interp').disabled=true;
  document.getElementById('btn-trans').querySelector('.ana-btn-desc').textContent='가사 먼저 필요';
  document.getElementById('btn-interp').querySelector('.ana-btn-desc').textContent='번역 먼저 필요';
  document.getElementById('ana-content').innerHTML='<div class="empty"><div class="ico">👆</div>위 버튼을 눌러 분석을 시작하세요</div>';
  // 대화탭 업데이트
  document.getElementById('chat-track-name').textContent=`${title} — ${artist}`;
  document.getElementById('chat-now').innerHTML=`
    <div class="chat-cover">${artUrl?`<img src="${artUrl}">`:'🎵'}</div>
    <div class="chat-meta"><div class="chat-track">${esc(title)}</div><div class="chat-sub">${esc(artist)}</div></div>`;
  S.chatHist=[];
  resetDifficulty();
  goTab('a');
  fetchLyrics(artist,title);
}

// ── LYRICS ──
async function fetchLyrics(artist,title){
  // 1. lyrics.ovh 시도
  try{
    const res=await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
    const d=await res.json();
    if(d.lyrics?.trim()){S.track.lyrics=d.lyrics.trim();S.track.lyricsSrc='lyrics.ovh';return;}
  }catch{}
  // 2. lrclib 시도 (한국어 포함 다국어 지원)
  try{
    const res=await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(artist+' '+title)}`);
    const d=await res.json();
    if(Array.isArray(d)&&d.length>0){
      const match=d.find(x=>x.plainLyrics)||d[0];
      if(match?.plainLyrics?.trim()){S.track.lyrics=match.plainLyrics.trim();S.track.lyricsSrc='lrclib.net';return;}
    }
  }catch{}
  S.track.lyricsSrc=null;
}

// ── 한국어 감지 ──
function isKorean(text){
  if(!text) return false;
  const koreanChars = (text.match(/[가-힣]/g)||[]).length;
  const totalChars = text.replace(/\s/g,'').length;
  return totalChars > 0 && (koreanChars/totalChars) > 0.5; // 50% 이상 한글이면 한국어
}

// 분석 결과를 스트리밍으로 채운다. 글자가 오는 대로 그리되 너무 잦은 렌더는 막는다.
// 스트리밍이 막히면 일반 호출로 넘어가므로 결과가 없어지는 일은 없다.
async function runSection(type, prompt, thinkBudget){
  let lastPaint=0;
  const paint=(text,force)=>{
    const now=Date.now();
    if(!force && now-lastPaint<400) return;
    lastPaint=now;
    renderResult(type,text);
  };
  try{
    const full=await callGeminiStream(prompt, t=>paint(t,false), [], null, thinkBudget);
    paint(full,true);
    return full;
  }catch(e){
    if(e.fatal) throw e;
    const full=await callGemini(prompt,'ana-content',[],null,thinkBudget);
    renderResult(type,full);
    return full;
  }
}

  }
  if(type==='desc'){
    content.innerHTML=`<div class="result-box"><div class="result-box-title">📖 곡 설명</div><div class="result-text">${mdToHtml(text)}</div></div>`;
    return;
  }
  if(type==='trans'){
    const lines=text.split('\n');
    let html='<div class="result-box"><div class="result-box-title">🌐 가사 번역</div>';
    let i=0;
    while(i<lines.length){
      const l=lines[i]||'';
      if(!l.trim()){html+='<div style="height:.5rem"></div>';i++;continue;}
      const n=lines[i+1]||'';
      if(n.trim()&&!n.startsWith('💬')){
        html+=`<div class="lyric-line"><div class="lyric-orig">${esc(l)}</div><div class="lyric-ko">${esc(n)}</div></div>`;i+=2;
      }else{
        html+=`<div class="lyric-line"><div class="lyric-orig">${esc(l)}</div></div>`;i++;
      }
    }
    content.innerHTML=html+'</div>';return;
  }
  if(type==='interp'){
    const lines=text.split('\n');
    let html='<div class="result-box"><div class="result-box-title">🔍 가사 해석</div>';
    let i=0;
    while(i<lines.length){
      const l0=lines[i]||'';
      if(!l0.trim()){html+='<div style="height:.6rem"></div>';i++;continue;}
      if(l0.startsWith('💬')){html+=`<div class="lyric-explain">${esc(l0)}</div>`;i++;continue;}
      const l1=lines[i+1]||'';
      const l2=lines[i+2]||'';
      if(l1.trim()&&!l1.startsWith('💬')&&l2.startsWith('💬')){
        html+=`<div class="lyric-line"><div class="lyric-orig">${esc(l0)}</div><div class="lyric-ko">${esc(l1)}</div><div class="lyric-explain">${esc(l2)}</div></div>`;i+=3;
      }else if(l1.startsWith('💬')){
        html+=`<div class="lyric-line"><div class="lyric-orig">${esc(l0)}</div><div class="lyric-explain">${esc(l1)}</div></div>`;i+=2;
      }else{
        html+=`<div class="lyric-line"><div class="lyric-orig">${esc(l0)}</div></div>`;i++;
      }
    }
    content.innerHTML=html+'</div>';return;
  }
}

function resetDifficulty(){
  const area=document.getElementById('chat-area');
  if(!area) return;
  S.cache.difficulty='';
  area.innerHTML=S.track
    ? `<div class="bbl a">🎵 <b>${esc(S.track.title)}</b> — ${esc(S.track.artist)}<br>
         아래에서 골라보세요. 결과를 보고 이어서 질문해도 됩니다.</div>
       <div class="tool-row">
         <button class="diff-go" onclick="doDifficulty()">🎚️ 파트별 난이도</button>

       </div>`
    : '<div class="bbl a">검색 탭에서 곡을 먼저 선택해주세요 🎵</div>';
}

// 분석 결과를 말풍선에 흘려 넣는다. 세 기능이 같은 자리를 쓰므로 하나로 묶었다.
async function runTool(prompt, thinkBudget, cacheKey, extraHtml=''){
  const area=document.getElementById('chat-area');
  let lastPaint=0;
  const paint=(text,force)=>{
    const now=Date.now();
    if(!force&&now-lastPaint<400) return;
    lastPaint=now;
    area.innerHTML=`<div class="bbl a">${mdToHtml(text)}</div>`+(force?extraHtml:'');
    area.scrollTop=area.scrollHeight;
  };
  area.innerHTML='<div class="bbl a"><div class="spin" style="width:14px;height:14px;border-width:2px;margin:0 auto"></div></div>';
  try{
    let full;
    try{
      full=await callGeminiStream(prompt,t=>paint(t,false),[],null,thinkBudget);
    }catch(e){
      if(e.fatal) throw e;
      full=await callGemini(prompt,null,[],null,thinkBudget);
    }
    paint(full,true);
    if(cacheKey) S.cache[cacheKey]=full;
  }catch(e){
    area.innerHTML=`<div class="bbl a">오류: ${esc(e.message)}</div>
      <button class="diff-go" onclick="resetDifficulty()">돌아가기</button>`;
  }
}

## 한눈에
전체적으로 어느 정도 난이도인지, 어떤 편성의 곡인지 한 문단으로.
그리고 이 곡에서 가장 까다로운 파트가 무엇인지 짚어주세요.

그다음 파트마다 "## 파트이름 ★★★☆☆" 형태로 소제목을 달고(별 다섯 개 중 채움),
아래 내용을 문장으로 풀어 쓰세요.

보컬이 있으면 반드시 다음을 다루세요:
- 음역: 최저음과 최고음을 반드시 음이름으로 적으세요(예: "G3 ~ C#5, 원곡 키 기준").
  그리고 그 폭이 얼마나 넓은지 한 줄로 덧붙이세요.
- 고음 구간: 높은 음이 어디에 나오고 얼마나 오래 머무는지
- 호흡: 한 호흡에 밀어붙여야 하는 긴 프레이즈가 있는지
- 발성 전환: 진성과 가성을 오가는 구간, 믹스보이스가 필요한 대목
- 성량과 지구력: 계속 강하게 질러야 하는지, 곡 후반에 체력이 남는지
- 리듬과 음정: 박자가 까다롭거나 음정이 잡기 어려운 부분

악기 파트(기타·베이스·드럼·건반·현악·관악 등)는 그 악기에 맞게:
- 어떤 주법과 테크닉이 필요한지
- 속도와 리듬이 얼마나 빡빡한지
- 코드나 운지가 까다로운 부분
- 초보자가 걸려 넘어질 만한 지점

각 파트 끝에는 "가장 어려운 구간"을 한 줄로 짚어주세요. 가사가 주어졌다면
어느 대목인지 가사를 인용해 알려주면 좋습니다.

## 연습한다면
어디부터 손대는 게 좋을지, 쉽게 가려면 무엇을 바꾸면 되는지(키 조절, 템포 낮추기,

- 인사말 없이 "## 한눈에"부터 바로 시작하세요.

한국어로 써주세요.`;

async function sendChat(){
  if(!S.track){alert('검색 탭에서 곡을 먼저 선택해주세요!');goTab('s');return;}
  const inp=document.getElementById('chat-input');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';
  const area=document.getElementById('chat-area');
  addBbl(area,msg,'u');
  S.chatHist.push({role:'user',parts:[{text:msg}]});
  const ld=document.createElement('div');ld.className='bbl a';
  ld.innerHTML='<div class="spin" style="width:14px;height:14px;border-width:2px;margin:0 auto"></div>';
  area.appendChild(ld);area.scrollTop=area.scrollHeight;
  try{
    // 난이도 분석을 이미 받았다면 함께 넘긴다. 사용자는 보통 그 내용을 이어서 묻는다.
    const ctx=`현재 곡: ${S.track.title} — ${S.track.artist}\n`
      +`${S.track.lyrics?'가사:\n'+S.track.lyrics.substring(0,3000)+'\n':''}`
      +`${S.cache.difficulty?'\n앞서 파트별 난이도를 이렇게 정리했습니다:\n'+S.cache.difficulty.substring(0,2500):''}`
      +`${S.cache.intro?'\n앞서 이 가수 입문 가이드를 이렇게 썼습니다:\n'+S.cache.intro.substring(0,1500):''}`
      +`${S.cache.idioms?'\n앞서 가사 표현을 이렇게 풀었습니다:\n'+S.cache.idioms.substring(0,1500):''}`;
    const sysMsg=`당신은 음악을 잘 아는 조력자입니다. 지금 다음 곡에 대해 이야기하는 중입니다:\n${ctx}\n\n아는 것과 모르는 것을 분명히 구분하고, 확실하지 않으면 아는 척하지 말고 모른다고 말하세요. 한국어로 답변하세요.`;
    // 답이 오는 대로 말풍선을 채운다. 첫 글자가 도착하면 로딩 표시를 치운다.
    const bbl=document.createElement('div');bbl.className='bbl a';
    const show=t=>{
      if(ld.parentNode){area.removeChild(ld);area.appendChild(bbl);}
      bbl.innerHTML=mdToHtml(t);area.scrollTop=area.scrollHeight;
    };
    let reply;
    try{
      reply=await callGeminiStream(msg,show,S.chatHist.slice(-14),sysMsg,512);
    }catch(e){
      if(e.fatal) throw e;
      reply=await callGemini(msg,null,S.chatHist.slice(-14),sysMsg,512);
      show(reply);
    }
    if(ld.parentNode) area.removeChild(ld);
    S.chatHist.push({role:'model',parts:[{text:reply}]});
    // Gemini는 user와 model이 번갈아 오길 요구한다. 기록이 길어지면 앞에서 잘라내되
    // 항상 user 턴부터 시작하도록 짝수 개씩 덜어낸다.
    if(S.chatHist.length>40) S.chatHist.splice(0, S.chatHist.length-40);
  }catch(e){
    if(ld.parentNode) area.removeChild(ld);
    addBbl(area,'오류: '+e.message,'a');
    // 답을 못 받았으면 방금 넣은 사용자 턴을 되돌린다. 그대로 두면 다음 요청에
    // user 턴이 연속으로 들어가 Gemini가 대화 형식 오류를 낸다.
    S.chatHist.pop();
  }
}
function addBbl(c,t,r){
  const d=document.createElement('div');d.className='bbl '+r;
  // AI 답변만 서식을 살린다. 사용자가 친 글은 손대지 않는다.
  if(r==='a') d.innerHTML=mdToHtml(t); else d.textContent=t;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

// ── GEMINI (Cloudflare Worker 경유) ──
const WORKER_URL = 'https://musicai.kjseong0313.workers.dev';

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// 응답에서 실제 답글만 뽑는다. 추론 모델은 생각 과정을 thought 파트로 함께 보내고,
// 답이 여러 파트로 쪼개져 오기도 해서 parts[0]만 읽으면 잘리거나 빈 문자열이 된다.
function answerText(cand){
  return (cand?.content?.parts || [])
    .filter(p => p && p.thought !== true && typeof p.text === 'string')
    .map(p => p.text).join('');
}

// 분당 한도를 넘기지 않도록 호출 간격을 벌린다. Lite는 분당 15회라 4초에 한 번꼴이다.
// 넘기면 429가 나고 최대 2분을 기다려야 해서, 미리 늦추는 쪽이 훨씬 빠르다.
let paceLast=0, paceChain=Promise.resolve();
function paceCall(){
  const rpm=S.models.find(m=>m.id===S.model)?.quota?.rpm;
  const gap=rpm?Math.ceil(60000/rpm):0;   // 한도를 모르면 늦추지 않는다
  paceChain=paceChain.then(async()=>{
    const wait=paceLast+gap-Date.now();
    if(wait>0) await sleep(wait);
    paceLast=Date.now();
  });
  return paceChain;
}

function genConfig(thinkBudget){
  const cfg={temperature:0.8, maxOutputTokens:65536};
  // 추론을 지원하는 모델만 예산을 지정한다. 3.5 Flash는 두 문장짜리 답에도 생각 토큰을
  // 9천 개 넘게 써서, 두지 않으면 무료 한도가 순식간에 닳는다.
  const meta=S.models.find(m=>m.id===S.model);
  if(meta?.thinking && thinkBudget!==null) cfg.thinkingConfig={thinkingBudget:thinkBudget};
  return cfg;
}

function reqBody(prompt, history, sysText, thinkBudget){
  return JSON.stringify({
    model:S.model,
    payload:{
      contents:[...history,{role:'user',parts:[{text:prompt}]}],
      systemInstruction:{parts:[{text:sysText}]},
      generationConfig:genConfig(thinkBudget)
    }
  });
}

const DEFAULT_SYS='당신은 음악을 잘 아는 조력자입니다. 곡 소개, 가사 번역과 해석을 돕습니다. 아는 것과 모르는 것을 분명히 구분하고, 확실하지 않으면 아는 척하지 말고 모른다고 말하세요. 한국어로 답변하세요.';

// 글자가 오는 대로 onChunk(지금까지 누적된 전체 텍스트)를 부른다. 실패하면 예외를
// 던지고, 호출한 쪽에서 일반 호출로 넘어간다.
async function callGeminiStream(prompt, onChunk, history=[], sysOverride=null, thinkBudget=null){
  await paceCall();
  const res=await fetch(`${WORKER_URL}/stream`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:reqBody(prompt, history, sysOverride||DEFAULT_SYS, thinkBudget)
  });
  if(!res.ok || !res.body){
    const d=await res.json().catch(()=>null);
    const err=new Error(d?.error?.message||`HTTP ${res.status}`);
    err.code=d?.error?.code||res.status;
    err.fatal=[400,403,404].includes(err.code);
    throw err;
  }
  bumpUsage(S.model);
  const reader=res.body.getReader(), dec=new TextDecoder();
  let buf='', text='';
  for(;;){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');
    buf=lines.pop();   // 마지막 조각은 아직 안 끝났을 수 있어 다음 덩어리와 붙인다
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      const payload=line.slice(5).trim();
      if(!payload||payload==='[DONE]') continue;
      try{
        const t=answerText(JSON.parse(payload).candidates?.[0]);
        if(t){ text+=t; onChunk(text); }
      }catch{ /* 조각난 JSON은 건너뛴다 */ }
    }
  }
  if(!text) throw new Error('빈 응답을 받았습니다. 다시 시도해주세요.');
  return text;
}

async function callGemini(prompt, statusElId=null, history=[], sysOverride=null, thinkBudget=null, retries=6){
  const sysText = sysOverride || DEFAULT_SYS;

  for(let i=0; i<retries; i++){
    try{
      await paceCall();
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: reqBody(prompt, history, sysText, thinkBudget)
      });
      const d = await res.json();
      if(d.error?.code === 429){
        const wait = [15,30,60,120][i]||60;
        if(statusElId){const el=document.getElementById(statusElId);if(el)el.innerHTML=`<div class="retry-msg">⏳ 한도 초과. ${wait}초 후 재시도... (${i+1}/${retries})</div>`;}
        await sleep(wait*1000);
        continue;
      }
      // Cloudflare Worker가 요청을 처리하는 엣지 위치에 따라 Gemini가 간헐적으로
      // 지역 제한 오류를 낸다. 새 요청은 다른 엣지로 나갈 수 있으므로 재시도하면 보통 풀린다.
      if(d.error && /user location is not supported/i.test(d.error.message)){
        const wait = [2,4,8,15,20][i]||20;
        if(statusElId){const el=document.getElementById(statusElId);if(el)el.innerHTML=`<div class="retry-msg">⏳ 일시적 지역 오류. ${wait}초 후 재시도... (${i+1}/${retries})</div>`;}
        await sleep(wait*1000);
        continue;
      }
      if(d.error){
        const err = new Error(d.error.message);
        // 잘못된 요청이나 없는 모델은 다시 걸어도 결과가 같다. 6번씩 되풀이할 이유가 없다.
        err.fatal = [400, 403, 404].includes(d.error.code);
        throw err;
      }

      bumpUsage(S.model);
      const cand = d.candidates?.[0];
      const text = answerText(cand);
      if(text) return text;

      // 빈 응답을 그냥 돌려주면 화면이 이유 없이 비어 보인다. 왜 끊겼는지 알려준다.
      const reason = cand?.finishReason || d.promptFeedback?.blockReason || '';
      if(reason === 'MAX_TOKENS') throw new Error('답변이 길이 제한에 걸렸습니다. 더 짧게 물어보거나 다른 모델을 골라보세요.');
      if(/SAFETY|BLOCK|PROHIBITED/i.test(reason)) throw new Error('안전 필터에 걸려 답변이 차단되었습니다.');
      throw new Error(`빈 응답을 받았습니다${reason?' ('+reason+')':''}. 다시 시도해주세요.`);
    }catch(e){
      if(e.fatal || i===retries-1) throw e;
      await sleep(3000);
    }
  }
  throw new Error('요청 한도 초과. 잠시 후 다시 시도해주세요.');
}

function fmtMs(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// 모델은 마크다운으로 답하는데 그대로 내보내면 ###과 **가 글자로 보인다. 먼저 전부
// 이스케이프해서 원본 HTML을 무력화한 다음, 우리가 아는 서식만 되살린다.
function mdToHtml(s){
  return esc(s)
    .replace(/^\s*#{1,6}\s*(.+)$/gm, '<b class="md-h">$1</b>')
    // 구분선을 먼저 처리한다. 목록 변환보다 뒤에 두면 "---"가 "· --"가 되어 버린다.
    .replace(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/gm, '<span class="md-hr"></span>')
    // esc를 거치면 인용 부호 ">"는 "&gt;"가 되어 있다. 들여쓰기로 바꿔 준다.
    .replace(/^\s*&gt;\s?/gm, '　　')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/^\s*[-*]\s+/gm, '· ');
}
